openapi: 3.0.4
info:
  title: Marine Weather
  description: >-
    Marine Weather fetches offshore weather conditions for any marine
    coordinates by latitude and longitude. Each response details high and low
    temperatures, maximum wind speeds, precipitation totals, humidity, UV index,
    and sunrise and sunset times.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/marineweather:
    get:
      summary: Marine Weather
      description: >-
        Get the marine weather data for a location using latitude and longitude
        coordinates
      operationId: marineweather
      parameters:
        - name: lat
          in: query
          schema:
            type: number
          required: true
          description: The latitude coordinate of the location
          example: 29.48003
        - name: lon
          in: query
          schema:
            type: number
          required: true
          description: The longitude coordinate of the location
          example: -37.62424
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  location:
                    lat: 29.48003
                    lon: -37.62424
                  weather:
                    date: '2026-09-17'
                    avghumidity: 86
                    condition: Moderate or heavy rain shower
                    uv: 5
                    sunrise: 05:53 AM
                    sunset: 06:08 PM
                    moonrise: 12:04 PM
                    moonset: 10:42 PM
                    maxtempc: 25.9
                    maxtempf: 78.6
                    mintempc: 21.3
                    mintempf: 70.3
                    avgtempc: 24.9
                    avgtempf: 76.8
                    maxwindmph: 15.4
                    maxwindkph: 24.7
                    totalprecipmm: 14.89
                    totalprecipin: 0.59
                    totalsnowcm: 0
                    avgviskm: 7.4
                    avgvismiles: 4
                    moonphase: First Quarter
                    moonillumination: 42
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
